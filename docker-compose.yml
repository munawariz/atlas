services:
  app:
    build:
      context: .
      target: runner
    env_file: .env.local
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      # /login is the one route the proxy serves without a session, so it is the honest
      # liveness check — anything else would redirect and mask a broken app.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # --- One-off setup tasks ---------------------------------------------------
  # Behind a profile so `docker compose up` never runs them by accident.
  #
  #   docker compose --profile setup run --rm migrate
  #   docker compose --profile setup run --rm seed     # EMPTY databases only
  migrate:
    build:
      context: .
      target: tools
    env_file: .env.local
    profiles: ["setup"]
    command: ["node", "scripts/migrate.mjs", "supabase/migrations/0001_init.sql"]

  seed:
    build:
      context: .
      target: tools
    env_file: .env.local
    profiles: ["setup"]
    command: ["node", "scripts/migrate.mjs", "supabase/seed.sql"]
