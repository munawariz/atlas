<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#003511" />
    <title>Offline · Atlas</title>
    <style>
      /*
       * Standalone by necessity — this page is served when the network is gone, so it can
       * link to no stylesheet and load no font. The values are copied from the Atlas tokens.
       */
      :root {
        color-scheme: light;
        --forest-800: #003511;
        --forest-200: #bcd0c3;
        --lime-500: #d3fa53;
        --cream-100: #f7f4ed;
        --ink-700: #4e4e4e;
        --ink-900: #111111;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--cream-100);
        color: var(--ink-700);
        font-family: "Helvetica Neue", Arial, sans-serif;
        font-size: 16px;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 100%;
        max-width: 380px;
        padding: 40px 32px;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 12px 32px rgb(0 43 15 / 0.08);
        text-align: center;
      }

      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: var(--forest-800);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.1;
        color: var(--ink-900);
      }

      .wordmark {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.045em;
        color: var(--ink-900);
        margin-bottom: 4px;
      }

      p {
        margin: 0 0 24px;
        font-size: 15px;
      }

      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 48px;
        padding: 0 26px;
        border: 0;
        border-radius: 10px;
        background: var(--forest-800);
        color: #fff;
        font-family: inherit;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.02em;
        cursor: pointer;
        transition: background-color 140ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      button:hover {
        background: #0a3d1c;
      }

      button:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="mark">
        <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 2c.6 5.2 4.2 8.8 9.4 9.4v1.2C16.2 13.2 12.6 16.8 12 22h-1.2C10.2 16.8 6.6 13.2 1.4 12.6v-1.2C6.6 10.8 10.2 7.2 10.8 2z"
            fill="#d3fa53"
          />
        </svg>
      </span>

      <div class="wordmark">atlas</div>
      <h1>You&rsquo;re offline</h1>
      <p>
        Atlas reads your ledger live, so it needs a connection to show you real
        numbers. Nothing you have saved is lost.
      </p>

      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
